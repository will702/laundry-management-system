        <script>
            // Consistent print function for mobile and desktop
            window.printReceipt = function(htmlContent) {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                if (isMobile) {
                    // Mobile: Use iframe to print only receipt content
                    const iframe = document.createElement('iframe');
                    iframe.style.position = 'fixed';
                    iframe.style.top = '-1000px';
                    iframe.style.left = '-1000px';
                    iframe.style.width = '0px';
                    iframe.style.height = '0px';
                    iframe.style.border = 'none';
                    
                    document.body.appendChild(iframe);
                    
                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(htmlContent);
                    doc.close();
                    
                    setTimeout(() => {
                        try {
                            iframe.contentWindow.focus();
                            iframe.contentWindow.print();
                        } catch (e) {
                            console.error('Print error:', e);
                        }
                        
                        setTimeout(() => {
                            if (document.body.contains(iframe)) {
                                document.body.removeChild(iframe);
                            }
                        }, 1000);
                    }, 500);
                } else {
                    // Desktop: Use popup window
                    try {
                        const printWindow = window.open('', '_blank', 'width=800,height=600');
                        if (printWindow) {
                            printWindow.document.write(htmlContent);
                            printWindow.document.close();
                            printWindow.focus();
                            setTimeout(() => {
                                printWindow.print();
                                printWindow.close();
                            }, 1000);
                        }
                    } catch (error) {
                        console.error('Print popup error:', error);
                    }
                }
            };
            
            // Hide loading screen once app loads
            document.addEventListener('DOMContentLoaded', function() {
                // Check periodically if React has rendered
                const checkReactLoaded = () => {
                    const rootElement = document.getElementById('root');
                    if (rootElement && rootElement.children.length > 0) {
                        const loading = document.getElementById('app-loading');
                        if (loading) loading.style.display = 'none';
                    } else {
                        // Check again after a short delay
                        setTimeout(checkReactLoaded, 500);
                    }
                };
                
                // Start checking after a minimum delay
                setTimeout(checkReactLoaded, 1000);
                
                // Fallback: hide loading after maximum 10 seconds
                setTimeout(function() {
                    const loading = document.getElementById('app-loading');
                    if (loading) loading.style.display = 'none';
                }, 10000);
            });
            
            
            // Service Worker Registration
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js')
                        .then(function(registration) {
                            console.log('ServiceWorker registered successfully:', registration.scope);
                        })
                        .catch(function(error) {
                            console.log('ServiceWorker registration failed:', error);
                        });
                });
            }
            
            // PWA Install Prompt
            let deferredPrompt;
            
            window.addEventListener('beforeinstallprompt', function(e) {
                // Prevent Chrome 67 and earlier from automatically showing the prompt
                e.preventDefault();
                deferredPrompt = e;
                
                // Show custom install banner
                const banner = document.getElementById('pwa-install-banner');
                if (banner) banner.style.display = 'block';
                
                console.log('PWA install prompt ready');
            });
            
            // Handle install button click
            document.addEventListener('click', function(e) {
                if (e.target.id === 'pwa-install-btn') {
                    const banner = document.getElementById('pwa-install-banner');
                    if (banner) banner.style.display = 'none';
                    
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function(choiceResult) {
                            if (choiceResult.outcome === 'accepted') {
                                console.log('User accepted the PWA install prompt');
                            } else {
                                console.log('User dismissed the PWA install prompt');
                            }
                            deferredPrompt = null;
                        });
                    }
                }
                
                if (e.target.id === 'pwa-dismiss-btn') {
                    const banner = document.getElementById('pwa-install-banner');
                    if (banner) banner.style.display = 'none';
                }
            });
            
            // Handle successful installation
            window.addEventListener('appinstalled', function(evt) {
                console.log('LaundryPro PWA was installed');
                // Hide install banner if still visible
                const banner = document.getElementById('pwa-install-banner');
                if (banner) banner.style.display = 'none';
                
                // Optional: Track installation
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'pwa_install', {
                        event_category: 'PWA',
                        event_label: 'LaundryPro'
                    });
                }
            });
            
            // Check if app is running in standalone mode (installed PWA)
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                console.log('Running as installed PWA');
                document.body.classList.add('pwa-mode');
            }

        <script>
            // Aggressively remove any Emergent badges that get added dynamically
            function removeEmergentBadges() {
                // Remove by ID
                const badgeById = document.getElementById('emergent-badge');
                if (badgeById) {
                    badgeById.remove();
                }
                
                // Remove any links containing "emergent"
                const emergentLinks = document.querySelectorAll('a[href*="emergent"]');
                emergentLinks.forEach(link => link.remove());
                
                // Remove any elements with "Made with Emergent" text
                const allElements = document.querySelectorAll('*');
                allElements.forEach(el => {
                    if (el.textContent && el.textContent.includes('Made with Emergent')) {
                        el.remove();
                    }
                });
            }
            
            // Run immediately
            removeEmergentBadges();
            
            // Run after DOM is loaded
            document.addEventListener('DOMContentLoaded', removeEmergentBadges);
            
            // Run periodically to catch dynamically added badges
            setInterval(removeEmergentBadges, 1000);
            
            // Watch for new elements being added
            const observer = new MutationObserver(removeEmergentBadges);
            observer.observe(document.body, { 
                childList: true, 
                subtree: true 
            });
        </script>
