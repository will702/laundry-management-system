        <style>
            /* Loading screen while app loads */
            .app-loading {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f3f4f6;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            }
            .app-loading .icon {
                font-size: 48px;
                margin-bottom: 20px;
                animation: bounce 1s infinite;
            }
            @keyframes bounce {
                0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
                40% { transform: translateY(-10px); }
                60% { transform: translateY(-5px); }
            }
            .app-loading .title {
                font-size: 24px;
                font-weight: bold;
                color: #4f46e5;
                margin-bottom: 10px;
            }
            .app-loading .subtitle {
                font-size: 16px;
                color: #6b7280;
                margin-bottom: 30px;
            }
            .app-loading .spinner {
                width: 32px;
                height: 32px;
                border: 3px solid #e5e7eb;
                border-top: 3px solid #4f46e5;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>

        <div id="app-loading" class="app-loading" style="display: none;">
            <div class="icon">🧺</div>
            <div class="title">LaundryPro</div>
            <div class="subtitle">Memuat aplikasi...</div>
            <div class="spinner"></div>
        </div>
        
        <div id="root"></div>
        
        <!-- PWA Install Prompt -->
        <div id="pwa-install-banner" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #4f46e5; color: white; padding: 16px; z-index: 1000;">
            <div style="max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong>📱 Install LaundryPro</strong>
                    <br>
                    <small>Akses lebih cepat dan dapat digunakan offline</small>
                </div>
                <div>
                    <button id="pwa-install-btn" style="background: white; color: #4f46e5; border: none; padding: 8px 16px; border-radius: 6px; margin-right: 8px; cursor: pointer;">
                        Install
                    </button>
                    <button id="pwa-dismiss-btn" style="background: transparent; color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px; cursor: pointer;">
                        Nanti
                    </button>
                </div>
            </div>
        </div>
        
        <script>
            // Hide loading screen once app loads
            document.addEventListener('DOMContentLoaded', function() {
                // Check periodically if React has rendered
                const checkReactLoaded = () => {
                    const rootElement = document.getElementById('root');
                    if (rootElement && rootElement.children.length > 0) {
                        const loading = document.getElementById('app-loading');
                        if (loading) loading.style.display = 'none';
                    } else {
                        // Check again after a short delay
                        setTimeout(checkReactLoaded, 500);
                    }
                };
                
                // Start checking after a minimum delay
                setTimeout(checkReactLoaded, 1000);
                
                // Fallback: hide loading after maximum 10 seconds
                setTimeout(function() {
                    const loading = document.getElementById('app-loading');
                    if (loading) loading.style.display = 'none';
                }, 10000);
            });
            
            
            // Service Worker Registration
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js')
                        .then(function(registration) {
                            console.log('ServiceWorker registered successfully:', registration.scope);
                        })
                        .catch(function(error) {
                            console.log('ServiceWorker registration failed:', error);
                        });
                });
            }
            
            // PWA Install Prompt
            let deferredPrompt;
            
            window.addEventListener('beforeinstallprompt', function(e) {
                // Prevent Chrome 67 and earlier from automatically showing the prompt
                e.preventDefault();
                deferredPrompt = e;
                
                // Show custom install banner
                const banner = document.getElementById('pwa-install-banner');
                if (banner) banner.style.display = 'block';
                
                console.log('PWA install prompt ready');
            });
            
            // Handle install button click
            document.addEventListener('click', function(e) {
                if (e.target.id === 'pwa-install-btn') {
                    const banner = document.getElementById('pwa-install-banner');
                    if (banner) banner.style.display = 'none';
                    
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(function(choiceResult) {
                            if (choiceResult.outcome === 'accepted') {
                                console.log('User accepted the PWA install prompt');
                            } else {
                                console.log('User dismissed the PWA install prompt');
                            }
                            deferredPrompt = null;
                        });
                    }
                }
                
                if (e.target.id === 'pwa-dismiss-btn') {
                    const banner = document.getElementById('pwa-install-banner');
                    if (banner) banner.style.display = 'none';
                }
            });
            
            // Handle successful installation
            window.addEventListener('appinstalled', function(evt) {
                console.log('LaundryPro PWA was installed');
                // Hide install banner if still visible
                const banner = document.getElementById('pwa-install-banner');
                if (banner) banner.style.display = 'none';
                
                // Optional: Track installation
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'pwa_install', {
                        event_category: 'PWA',
                        event_label: 'LaundryPro'
                    });
                }
            });
            
            // Check if app is running in standalone mode (installed PWA)
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                console.log('Running as installed PWA');
                document.body.classList.add('pwa-mode');
            }
        <style>
